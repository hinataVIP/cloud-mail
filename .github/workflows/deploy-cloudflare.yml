name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct-fast' }}
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL || vars.CF_EMAIL || 'false' }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || 'false' }}

    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}

    steps:
      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 安装 Worker 依赖 / Install dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: 📡 禁用 Wrangler 遥测 / Disable Wrangler telemetry
        working-directory: ./mail-worker
        run: pnpm wrangler telemetry disable

      - name: 🔍 验证 Cloudflare 账户 / Verify Cloudflare account
        working-directory: ./mail-worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm wrangler whoami

      - name: 🛠️ 设置环境 / Set up environment
        working-directory: ./mail-worker
        shell: bash
        run: |
          set -euo pipefail

          echo "🔐 Starting environment setup..."

          if [ -z "$JWT_SECRET" ] || grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
            echo "❌ JWT_SECRET is empty or contains invalid characters."
            exit 1
          fi

          if ! jq -e 'type == "array"' <<< "$DOMAIN" >/dev/null; then
            echo '❌ DOMAIN must be a JSON array, e.g. ["example.com"].'
            exit 1
          fi

          if [ -z "$ADMIN" ]; then
            echo "❌ ADMIN cannot be empty."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID cannot be empty."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN cannot be empty."
            exit 1
          fi

          CONFIG_FILE="wrangler-action.toml"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ $CONFIG_FILE not found."
            exit 1
          fi

          if [ -z "$R2_BUCKET_NAME" ]; then
            sed -i '/\[\[r2_buckets\]\]/,/^$/d' "$CONFIG_FILE"
          fi

          if [ -z "$PROJECT_LINK" ]; then
            sed -i '/^project_link = /d' "$CONFIG_FILE"
          fi

          if [ -z "$CUSTOM_DOMAIN" ]; then
            sed -i '/\[\[routes\]\]/,/^$/d' "$CONFIG_FILE"
          fi

          if [ "$(printf '%s' "$CLOUDFLARE_EMAIL" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'

          [[send_email]]
          name = "email"
          EOF
          fi

          export NAME CUSTOM_DOMAIN DOMAIN ADMIN JWT_SECRET
          export R2_BUCKET_NAME PROJECT_LINK ANALYSIS_CACHE AI_MODEL

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler-action.toml")
          text = path.read_text()
          values = [
              "NAME", "CUSTOM_DOMAIN", "DOMAIN", "ADMIN", "JWT_SECRET",
              "R2_BUCKET_NAME", "PROJECT_LINK", "ANALYSIS_CACHE", "AI_MODEL",
              "KV_NAMESPACE_ID", "D1_DATABASE_ID",
              "LINUXDO_CLIENT_ID", "LINUXDO_CLIENT_SECRET", "LINUXDO_CALLBACK_URL"
          ]
          for key in values:
              value = os.environ.get(key, "")
              text = text.replace("${" + key + "}", value)
          path.write_text(text)
          PY

          echo "✅ Environment setup completed."

      - name: ⚡ 设置 KV 数据库 / Set up KV database
        working-directory: ./mail-worker
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="wrangler-action.toml"

          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using KV namespace from environment variables."
            exit 0
          fi

          echo "🔍 Checking whether KV namespace exists..."
          KV_LIST=$(pnpm wrangler kv namespace list)

          if echo "$KV_LIST" | jq -e --arg name "$NAME" '.[] | select(.title == $name)' >/dev/null; then
            KV_ID=$(echo "$KV_LIST" | jq -r --arg name "$NAME" '.[] | select(.title == $name) | .id' | head -n 1)
          else
            echo "⚠️ KV namespace not found. Creating..."
            pnpm wrangler kv namespace create "$NAME"
            KV_LIST=$(pnpm wrangler kv namespace list)
            KV_ID=$(echo "$KV_LIST" | jq -r --arg name "$NAME" '.[] | select(.title == $name) | .id' | head -n 1)
          fi

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "❌ Could not obtain KV namespace ID."
            exit 1
          fi

          sed -i "s|\${KV_NAMESPACE_ID}|${KV_ID}|g" "$CONFIG_FILE"
          echo "✅ KV namespace configured."

      - name: 🐬 设置 D1 数据库 / Set up D1 database
        working-directory: ./mail-worker
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="wrangler-action.toml"

          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using D1 database from environment variables."
            exit 0
          fi

          echo "🔍 Checking whether D1 database exists..."
          DB_LIST=$(pnpm wrangler d1 list --json)

          if echo "$DB_LIST" | jq -e --arg name "$NAME" '.[] | select(.name == $name)' >/dev/null; then
            D1_ID=$(echo "$DB_LIST" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .uuid' | head -n 1)
          else
            echo "⚠️ D1 database not found. Creating..."
            pnpm wrangler d1 create "$NAME"
            DB_LIST=$(pnpm wrangler d1 list --json)
            D1_ID=$(echo "$DB_LIST" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .uuid' | head -n 1)
          fi

          if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
            echo "❌ Could not obtain D1 database ID."
            exit 1
          fi

          sed -i "s|\${D1_DATABASE_ID}|${D1_ID}|g" "$CONFIG_FILE"
          echo "✅ D1 database configured."

      - name: 🚀 开始部署 / Start deployment
        id: deploy
        working-directory: ./mail-worker
        shell: bash
        run: |
          set -uo pipefail
          echo "🚀 Starting deployment..."

          set +e
          pnpm wrangler deploy -c wrangler-action.toml 2>&1 | tee deploy.log
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$DEPLOY_EXIT_CODE" -ne 0 ]; then
            echo "❌ Wrangler deployment failed with exit code $DEPLOY_EXIT_CODE."
            exit "$DEPLOY_EXIT_CODE"
          fi

          WORKER_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)

          if [ -n "$WORKER_URL" ]; then
            echo "::add-mask::$WORKER_URL"
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment completed."

      - name: ♻️ 初始化数据库 / Initialize database
        shell: bash
        run: |
          set -euo pipefail
          echo "🛠️ Starting database initialization..."
          sleep 15

          WORKER_URL="${CUSTOM_DOMAIN:+https://$CUSTOM_DOMAIN}"
          WORKER_URL="${WORKER_URL:-${{ steps.deploy.outputs.worker_url }}}"

          if [ -z "$WORKER_URL" ]; then
            echo "❌ Preview URL not available. Please set CUSTOM_DOMAIN."
            exit 1
          fi

          HTTP_CODE=$(curl -sL -w "%{http_code}" -o response.txt "$WORKER_URL/api/init/${JWT_SECRET}")
          RESPONSE_BODY=$(cat response.txt)

          if [ "$RESPONSE_BODY" = "success" ]; then
            echo "✅ Database initialization completed."
          else
            echo "❌ Initialization failed. HTTP: $HTTP_CODE, Response: $RESPONSE_BODY"
            exit 1
          fi

      - name: 🗑️ 删除运行记录 / Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: "1"
          keep_minimum_runs: "0"
